name: Railway CI
permissions:
  contents: read

on:
  push:
    branches:
      - 'trunk'
    paths:
      - 'railway.json'
      - '.github/workflows/railway-validate.yml'
  pull_request:
    branches:
      - 'trunk'
    paths:
      - 'railway.json'
      - '.github/workflows/railway-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - uses: sourcemeta/jsonschema@cb9ec0145533126399065ffa13d3638842c65e25
    - name: Validate railway.json against schema
      run: jsonschema metaschema railway.json --verbose --http
