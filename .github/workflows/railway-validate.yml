name: Railway CI
permissions:
  contents: read

on:
  push:
    branches:
      - 'trunk'
    paths:
      - 'railway.json'
      - '.github/workflows/railway-validate.yml'
  pull_request:
    branches:
      - 'trunk'
    paths:
      - 'railway.json'
      - '.github/workflows/railway-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - uses: sourcemeta/jsonschema@cb9ec0145533126399065ffa13d3638842c65e25
    - name: Validate railway.json against schema
      run: jsonschema metaschema railway.json --verbose --http
