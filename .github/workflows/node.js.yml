# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI
permissions:
  contents: read

on:
  push:
    branches:
      - 'trunk'
  pull_request:
    branches:
      - 'trunk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Use Node.js latest
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: latest
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Type-check
      run: npx tsc --noEmit
    - name: Lint
      run: npx eslint src
    - name: Unit tests with coverage
      run: npx vitest run --coverage

  compose:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Use Docker Compose latest
      uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6
      with:
        version: latest
    - run: docker compose up --yes --detach --wait
      env:
        PORT: 3000
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        SECRET: test
        STEAM_API_KEY: test
        HOST: localhost
    - name: Check site is available
      run: curl --fail --silent --show-error --max-time 5 --retry 5 --retry-delay 0 --retry-max-time 30 --retry-all-errors "http://localhost:3000/seasons" || exit 1
    - name: Show server logs on failure
      if: failure()
      run: |
        echo "=== Server logs ==="
        docker compose logs server
        echo "=== Database logs ==="
        docker compose logs db
    - name: Cleanup
      if: always()
      run: |
        docker compose down --volumes --timeout 10
